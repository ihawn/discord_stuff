# The server pulls the CI images (IMAGE_PREFIX in .env); for local work run `docker compose up --build`.
name: rico

services:
  transcriber:
    image: ${IMAGE_PREFIX:-localhost/rico}/transcriber:latest
    build: ./transcriber
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./models:/models
    # The server is shared with other projects: cap what this stack can take. At the cap the
    # kernel kills this container, not its neighbours.
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 4

  bot:
    image: ${IMAGE_PREFIX:-localhost/rico}/bot:latest
    build: ./bot
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./data:/data
    depends_on:
      - transcriber
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2
